[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "promptpack"
version = "0.1.0"
description = "Pack any project folder into a compact, AI-readable XML snapshot — strip noise, keep signal, cut context by ~50%"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
  { name = "AchillesHubTeam", email = "achilleshubteam@gmail.com" }
]
keywords = [
  "ai", "llm", "context", "prompt", "xml", "minify",
  "code", "project", "snapshot", "compression", "claude", "gpt"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Utilities",
  "Topic :: Text Processing :: Markup :: XML",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AchillesHubTeam/promptpack"
Repository = "https://github.com/AchillesHubTeam/promptpack"
"Bug Tracker" = "https://github.com/AchillesHubTeam/promptpack/issues"
Changelog = "https://github.com/AchillesHubTeam/promptpack/releases"

[project.scripts]
promptpack = "promptpack.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["promptpack*"]

[tool.setuptools.package-data]
promptpack = ["py.typed"]
